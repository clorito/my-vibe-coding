<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Vibe Coding 第一步</title>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #d6eaff 0%, #eaf4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2b2f3a;
    }
    .card {
      background: #fff;
      padding: 48px 56px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(79, 124, 255, .12);
      text-align: center;
      max-width: 420px;
    }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p  { color: #667; line-height: 1.7; margin: 0 0 28px; }
    #clock { color: #7a8699; font-size: 13px; margin-top: 20px; }
    button {
      padding: 12px 32px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #4f7cff;
      color: #fff;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 124, 255, .35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>我的 Vibe Coding 第一步</h1>
    <p>你好！这是我用一句话让 AI 生成的第一个网页。<br>从这里开始，我会学着把想法变成真正能运行的程序。</p>
    <button onclick="sayHello()">点我试试 👋</button>
    <div id="clock"></div>
  </div>

  <script>
    // 修改 3：记录标题当前字号，每次点击 +2px（14 是起点，取整数便于递增）
    let titleSize = 26;

    function sayHello() {
      alert("我开始学编程啦！");
      // 每点一次，标题字号加 2，同时更新 CSS 里记录的起点
      titleSize += 2;
      document.querySelector("h1").style.fontSize = titleSize + "px";
    }

    // 修改 2：每秒刷新一次当前时间
    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent =
        "当前时间：" + now.toLocaleString("zh-CN");
    }
    tick();                    // 页面打开先显示一次，不用等 1 秒
    setInterval(tick, 1000);   // 之后每 1000 毫秒（1 秒）更新一次
  </script>
</body>
</html>
