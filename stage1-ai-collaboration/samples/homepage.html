<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>
  <style>
    /* ===== 全局样式：改主题色只需要改下面这行 ===== */
    :root { --theme: #4f7cff; --bg: #f7f8fc; --text: #2b2f3a; }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== 导航栏 ===== */
    nav {
      display: flex;               /* flex 让导航项横向排列 */
      justify-content: space-between;
      align-items: center;
      padding: 16px 8%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    nav .logo { font-weight: bold; color: var(--theme); font-size: 20px; }
    nav .links a {
      margin-left: 24px;
      text-decoration: none;
      color: var(--text);
    }
    nav .links a:hover { color: var(--theme); }

    /* ===== 自我介绍区 ===== */
    .hero { text-align: center; padding: 60px 8%; }
    .hero h1 { font-size: 32px; }
    .hero p { color: #666; max-width: 480px; margin: 12px auto; }

    /* ===== 兴趣卡片：想改成 4 列，把 33% 改成 25% ===== */
    .cards {
      display: flex;
      flex-wrap: wrap;             /* 屏幕窄时自动换行 */
      gap: 16px;
      padding: 0 8% 60px;
    }
    .card {
      flex: 1 1 30%;               /* 每张卡大约占 1/3 宽 */
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .card .emoji { font-size: 32px; }
    .card h3 { margin: 12px 0 8px; }
    .card p { color: #666; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <nav>
    <span class="logo">我的主页</span>
    <span class="links">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="works.html">作品</a>
    </span>
  </nav>

  <section class="hero">
    <h1>你好，我在学 Vibe Coding 👋</h1>
    <p>这是我的第一个个人主页，由我和 AI 一起完成。我会在这里记录学习过程和作品。</p>
  </section>

  <section class="cards">
    <div class="card">
      <div class="emoji">🎵</div>
      <h3>音乐</h3>
      <p>通勤时喜欢听歌，正在学用 AI 做一个歌单管理小工具。</p>
    </div>
    <div class="card">
      <div class="emoji">📷</div>
      <h3>摄影</h3>
      <p>周末出门拍照，希望做一个自己的相册网站。</p>
    </div>
    <div class="card">
      <div class="emoji">🐱</div>
      <h3>养猫</h3>
      <p>家里有一只猫，第一个毕业项目想做一个喂猫提醒器。</p>
    </div>
  </section>
</body>
</html>
