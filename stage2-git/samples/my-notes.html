<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的记事本</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 520px; margin: 40px auto; background: #fafafa; }
    h1 { font-size: 22px; }
    input {
      width: 100%; box-sizing: border-box; padding: 10px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 15px;
    }
    button {
      margin-top: 10px; padding: 10px 18px; border: none; border-radius: 8px;
      background: #4f7cff; color: #fff; font-size: 15px; cursor: pointer;
    }
    ul { list-style: none; padding: 0; }
    li {
      background: #fff; padding: 12px; border-radius: 8px; margin-top: 8px;
      display: flex; justify-content: space-between; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    li .del { color: #e5484d; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📝 我的记事本</h1>
  <input id="noteInput" placeholder="写点什么，回车保存（存在浏览器里，刷新不丢）">
  <button onclick="addNote()">保存</button>
  <ul id="noteList"></ul>

  <script>
    // localStorage 是浏览器自带的迷你数据库：像一个不会丢的变量
    const KEY = "my-notes";

    function loadNotes() {
      // localStorage 只能存字符串，所以用 JSON 数组存多条笔记
      return JSON.parse(localStorage.getItem(KEY) || "[]");
    }

    function saveNotes(notes) {
      localStorage.setItem(KEY, JSON.stringify(notes));
    }

    function render() {
      const notes = loadNotes();
      const list = document.getElementById("noteList");
      list.innerHTML = "";                       // 先清空再重画
      notes.forEach((text, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<span></span><span class="del">删除</span>`;
        li.querySelector("span").textContent = text;
        li.querySelector(".del").onclick = () => {
          const next = loadNotes();
          next.splice(i, 1);                     // 删掉第 i 条
          saveNotes(next);
          render();
        };
        list.appendChild(li);
      });
    }

    function addNote() {
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) return;
      const notes = loadNotes();
      notes.push(text);
      saveNotes(notes);
      input.value = "";
      render();
    }

    document.getElementById("noteInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addNote();
    });

    render();
  </script>
</body>
</html>
