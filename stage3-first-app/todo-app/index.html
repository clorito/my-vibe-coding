<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>待办清单</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 480px; margin: 40px auto; background: #f6f8fb; color: #2b2f3a; }
    h1 { font-size: 22px; }
    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
    .add-row button { padding: 10px 16px; border: none; border-radius: 8px; background: #4f7cff; color: #fff; cursor: pointer; }
    .filters { margin: 14px 0; display: flex; gap: 8px; }
    .filters button { border: 1px solid #ddd; background: #fff; border-radius: 20px; padding: 4px 14px; cursor: pointer; }
    .filters button.active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
    .count { color: #888; font-size: 13px; margin-left: auto; align-self: center; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; padding: 12px; border-radius: 8px; margin-top: 8px; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    li.done .title { text-decoration: line-through; color: #aaa; }
    li .title { flex: 1; }
    li .due { color: #999; font-size: 12px; }
    li .del { color: #e5484d; cursor: pointer; }
  </style>
</head>
<body>
  <h1>✅ 待办清单</h1>

  <div class="add-row">
    <input id="titleInput" placeholder="要做什么？">
    <input id="dueInput" type="date">
    <button onclick="addTodo()">添加</button>
  </div>

  <div class="filters">
    <button data-f="all" class="active" onclick="setFilter('all', this)">全部</button>
    <button data-f="open" onclick="setFilter('open', this)">未完成</button>
    <button data-f="done" onclick="setFilter('done', this)">已完成</button>
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>

  <script>
    const KEY = "todos";
    let filter = "all";

    const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
    const save = t => localStorage.setItem(KEY, JSON.stringify(t));

    function render() {
      const todos = load();
      const visible = todos.filter(t =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );
      const list = document.getElementById("list");
      list.innerHTML = "";
      visible.forEach(t => {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");
        li.innerHTML = `
          <input type="checkbox" ${t.done ? "checked" : ""}>
          <span class="title"></span>
          <span class="due"></span>
          <span class="del">✕</span>`;
        li.querySelector(".title").textContent = t.title;
        li.querySelector(".due").textContent = t.due || "";
        li.querySelector("input").onchange = () => {
          const all = load();
          const item = all.find(x => x.id === t.id);
          item.done = !item.done;
          save(all); render();
        };
        li.querySelector(".del").onclick = () => {
          save(load().filter(x => x.id !== t.id));
          render();
        };
        list.appendChild(li);
      });
      document.getElementById("count").textContent =
        `未完成 ${todos.filter(t => !t.done).length} 项`;
    }

    function addTodo() {
      const title = document.getElementById("titleInput").value.trim();
      if (!title) return alert("请输入内容");
      const due = document.getElementById("dueInput").value;
      const todos = load();
      todos.push({ id: Date.now(), title, due, done: false });
      save(todos);
      document.getElementById("titleInput").value = "";
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    document.getElementById("titleInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
