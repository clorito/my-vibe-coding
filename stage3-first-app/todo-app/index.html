<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单 Pro</title>
  <style>
    /* ===== 深色科技风：延续个人主页的配色体系 ===== */
    :root {
      color-scheme: dark;   /* 让日期选择器等原生控件也用深色渲染 */
      --bg: #0a0e17;
      --panel: #151d30;
      --text: #dbe6f5;
      --muted: #8fa3bf;
      --theme: #7fdbff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app { width: 100%; max-width: 560px; }

    h1 {
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--theme);
      text-align: center;
      margin: 0 0 24px;
      text-shadow: 0 0 12px rgba(127, 219, 255, .5);
    }

    /* ===== 添加区 ===== */
    .add-row {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid rgba(127, 219, 255, .15);
      border-radius: 12px;
      padding: 12px;
    }
    .add-row input, .add-row select {
      background: #0d1322;
      border: 1px solid rgba(127, 219, 255, .2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }
    .add-row #titleInput { flex: 1; }
    .add-row button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    /* ===== 筛选栏 ===== */
    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 2px;
    }
    .filters button {
      border: 1px solid rgba(127, 219, 255, .25);
      background: transparent;
      color: var(--muted);
      border-radius: 18px;
      padding: 4px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .filters button.active {
      background: rgba(127, 219, 255, .15);
      color: var(--theme);
      border-color: var(--theme);
    }
    .count { margin-left: auto; color: var(--muted); font-size: 13px; }

    /* ===== 列表 ===== */
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid rgba(127, 219, 255, .1);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 8px;
      transition: border-color .2s;
    }
    li:hover { border-color: rgba(127, 219, 255, .35); }

    /* 优先级色块 */
    .pri {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: #0a0e17;
      flex-shrink: 0;
    }

    li .title { flex: 1; font-size: 15px; }
    li.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }
    li .title.overdue { color: #ff5f6b; }

    li .due { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    li .due.overdue { color: #ff5f6b; }

    li .op {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      flex-shrink: 0;
    }
    li .op:hover { color: var(--theme); }
    li .op.del:hover { color: #ff5f6b; }

    /* 编辑态的输入框 */
    li .edit-input {
      flex: 1;
      background: #0d1322;
      border: 1px solid var(--theme);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>✅ 待办清单 PRO</h1>

    <div class="add-row">
      <input id="titleInput" placeholder="要做什么？">
      <input id="dueInput" type="date">
      <select id="priInput" title="优先级：1 最紧急，7 最不急">
        <option value="1">P1</option><option value="2">P2</option>
        <option value="3">P3</option><option value="4" selected>P4</option>
        <option value="5">P5</option><option value="6">P6</option>
        <option value="7">P7</option>
      </select>
      <button onclick="addTodo()">添加</button>
    </div>

    <div class="filters">
      <button data-f="all" class="active" onclick="setFilter('all', this)">全部</button>
      <button data-f="open" onclick="setFilter('open', this)">未完成</button>
      <button data-f="done" onclick="setFilter('done', this)">已完成</button>
      <span class="count" id="count"></span>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none">这里空空如也</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
