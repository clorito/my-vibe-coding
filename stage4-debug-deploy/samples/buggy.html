<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>找 Bug 练习</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; max-width: 420px; margin: 40px auto; }
    input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #4f7cff; color: #fff; cursor: pointer; }
    li { background: #f4f6fa; padding: 10px; border-radius: 6px; margin-top: 6px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>🐛 找 Bug 练习（共 3 处）</h1>
  <input id="input"><button onclick="add()">添加</button>
  <ul id="list"></ul>

  <script>
    // Bug 提示：
    // ① 打开页面按 F12 看控制台报错
    // ② 添加一条后刷新页面，数据丢了
    // ③ 点删除按钮没反应

    function load() {
      return JSON.parse(localStorage.getItem("items"));   // ← Bug 1 区域
    }

    function render() {
      const items = load();
      const list = document.getElementById("list");
      list.innerHTML = "";
      items.forEach((t, i) => {
        const li = document.createElement("li");
        li.innerHTML = "<span></span><span class='del' style='color:#e5484d;cursor:pointer'>删除</span>";
        li.querySelector("span").textContent = t;
        document.querySelector(".del").onclick = () => {   // ← Bug 2 区域
          const next = load();
          next.splice(i, 1);
          localStorage.setItem("items", JSON.stringify(next));
          render();
        };
        list.appendChild(li);
      });
    }

    function add() {
      const v = document.getElementById("input").value.trim();
      if (!v) return;
      const items = load();
      items.push(v);
      // ← Bug 3 区域：少了什么？
      render();
    }

    render();
  </script>
</body>
</html>
